<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0A2A66"/>
      <stop offset="1" stop-color="#1F6FD1"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#DCEBFF"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#sky)"/>
  <!-- back ridge -->
  <path d="M-20 1024 L250 640 L380 760 L560 520 L1044 1024 Z" fill="#5C93DE" opacity=".55"/>
  <!-- main peak -->
  <path d="M60 1024 L470 430 L640 650 L720 560 L1000 1024 Z" fill="url(#face)"/>
  <!-- shadow faces -->
  <path d="M470 430 L560 1024 L1000 1024 L720 560 L640 650 Z" fill="#B9D3F5"/>
  <!-- snowflake -->
  <g transform="translate(730 290)" stroke="#FFFFFF" stroke-width="58" stroke-linecap="round" fill="none">
    <g id="arm">
      <line x1="0" y1="0" x2="0" y2="-190"/>
      <polyline points="-66,-150 0,-96 66,-150"/>
    </g>
    <use href="#arm" transform="rotate(60)"/>
    <use href="#arm" transform="rotate(120)"/>
    <use href="#arm" transform="rotate(180)"/>
    <use href="#arm" transform="rotate(240)"/>
    <use href="#arm" transform="rotate(300)"/>
  </g>
</svg>
